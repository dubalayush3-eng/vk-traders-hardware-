<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel & App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; text-align: center; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #0056b3; }
    .hidden { display: none; }
    .error { color: red; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Main View / Login Form -->
  <div id="login-section" class="card">
    <h2>Login / Admin Access</h2>
    <input type="email" id="email" placeholder="Email" style="width: 90%; padding: 8px; margin-bottom: 8px;"><br>
    <input type="password" id="password" placeholder="Password" style="width: 90%; padding: 8px; margin-bottom: 8px;"><br>
    <button id="btn-login">Login</button>
    <div id="login-error" class="error"></div>
  </div>

  <!-- Admin Panel View -->
  <div id="admin-panel" class="card hidden">
    <h2>Admin Dashboard</h2>
    <p>Welcome, Admin!</p>
    <button id="btn-action">Perform Admin Action</button><br>
    <button id="btn-logout" style="background: #dc3545;">Logout</button>
    <div id="status-msg"></div>
  </div>

  <!-- Firebase Scripts (v10 Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // 1. Apni Firebase Config yahan Replace karein
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 2. Firebase Initialize
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM Elements
    const loginSection = document.getElementById("login-section");
    const adminPanel = document.getElementById("admin-panel");
    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");
    const btnAction = document.getElementById("btn-action");
    const loginError = document.getElementById("login-error");
    const statusMsg = document.getElementById("status-msg");

    // 3. Auth State Observer (Button & Admin Panel Toggle Fix)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // User logged in -> Admin panel dikhao
        loginSection.classList.add("hidden");
        adminPanel.classList.remove("hidden");
      } else {
        // User logged out -> Login form dikhao
        loginSection.classList.remove("hidden");
        adminPanel.classList.add("hidden");
      }
    });

    // 4. Login Button Click Listener
    btnLogin.addEventListener("click", async () => {
      loginError.innerText = "";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        loginError.innerText = "Login failed: " + err.message;
      }
    });

    // 5. Logout Button Listener
    btnLogout.addEventListener("click", async () => {
      await signOut(auth);
    });

    // 6. Action Button (Database Test)
    btnAction.addEventListener("click", async () => {
      try {
        statusMsg.innerText = "Processing...";
        await setDoc(doc(db, "testCollection", "testDoc"), {
          lastUpdated: new Date().toISOString()
        });
        statusMsg.innerText = "Data saved successfully!";
      } catch (err) {
        statusMsg.innerText = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
