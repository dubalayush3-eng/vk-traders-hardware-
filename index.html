<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V K Traders & Hardware - Shivnagar</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- jsPDF & html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Firebase SDKs (Compat Build) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- TOP ANNOUNCEMENT BANNER -->
  <div id="bannerAlert" class="bg-amber-600 text-white text-xs font-semibold py-1.5 px-4 text-center hidden">
    <span id="bannerText">Special Discount on Hardware & Plumbing Items!</span>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-slate-900 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      
      <!-- Logo with 5-Tap Gesture Trigger -->
      <div id="logoTrigger" class="flex items-center space-x-2 cursor-pointer select-none">
        <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-black text-xl">VK</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">V K Traders</h1>
          <p class="text-xs text-amber-400 font-medium">& Hardware • Shivnagar</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-4">
        <button onclick="toggleWishlist()" class="relative text-gray-300 hover:text-white">
          <i class="fa-solid fa-heart text-xl"></i>
          <span id="wishlistBadge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-bold text-[10px] hidden">0</span>
        </button>

        <button onclick="toggleCart()" class="relative text-gray-300 hover:text-white">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span id="cartBadge" class="absolute -top-2 -right-2 bg-amber-500 text-slate-900 text-xs rounded-full w-4 h-4 flex items-center justify-center font-bold text-[10px] hidden">0</span>
        </button>

        <button id="adminPortalBtn" onclick="openAdminAuth()" class="text-xs bg-slate-800 hover:bg-slate-700 text-amber-400 px-2.5 py-1.5 rounded border border-slate-700">
          Admin
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CATALOG & STORE -->
  <main class="flex-grow max-w-6xl w-full mx-auto p-4">
    
    <!-- Search and Filter -->
    <div class="mb-6 flex flex-col md:flex-row gap-3">
      <div class="relative flex-grow">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
        <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Search plumbing, tools, construction items..." 
          class="w-full pl-10 pr-4 py-2.5 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white shadow-sm" />
      </div>
      <select id="categoryFilter" onchange="renderProducts()" class="py-2.5 px-4 border rounded-lg bg-white shadow-sm focus:ring-2 focus:ring-amber-500">
        <option value="All">All Categories</option>
        <option value="Plumbing">Plumbing & Pipes</option>
        <option value="Hardware">Hardware & Fasteners</option>
        <option value="Sanitary">Sanitaryware</option>
        <option value="Tools">Hand & Power Tools</option>
        <option value="Construction">Construction Materials</option>
      </select>
    </div>

    <!-- Dynamic Products Grid -->
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
      <div class="col-span-full text-center py-12 text-gray-500">Loading catalog items...</div>
    </div>
  </main>

  <!-- CART SIDE PANEL -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 hidden justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
        <h3 class="font-bold text-lg"><i class="fa-solid fa-cart-shopping mr-2 text-amber-400"></i>Shopping Cart</h3>
        <button onclick="toggleCart()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      
      <div id="cartItemsList" class="flex-grow overflow-y-auto p-4 space-y-3 divide-y">
        <!-- Cart Items Injection -->
      </div>

      <!-- Coupon & Summary -->
      <div class="p-4 border-t bg-gray-50 space-y-3">
        <div class="flex gap-2">
          <input type="text" id="couponInput" placeholder="Coupon Code" class="uppercase border px-3 py-1.5 text-sm rounded flex-grow">
          <button onclick="applyCoupon()" class="bg-slate-800 text-white text-xs px-3 py-1.5 rounded font-semibold">Apply</button>
        </div>
        
        <div id="couponMessage" class="text-xs"></div>

        <div class="space-y-1 text-sm border-t pt-2">
          <div class="flex justify-between text-gray-600"><span>Subtotal:</span><span id="cartSubtotal">₹0</span></div>
          <div class="flex justify-between text-green-600"><span>Discount:</span><span id="cartDiscount">-₹0</span></div>
          <div class="flex justify-between font-bold text-lg text-slate-900"><span>Total:</span><span id="cartTotal">₹0</span></div>
        </div>

        <button onclick="checkoutWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg flex items-center justify-center gap-2">
          <i class="fa-brands fa-whatsapp text-lg"></i> Order via WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- ADMIN AUTH MODAL -->
  <div id="authModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 relative">
      <button onclick="closeAuthModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      <h3 class="text-xl font-bold text-slate-900 mb-4">Admin Authentication</h3>
      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-gray-600">Admin Email</label>
          <input type="email" id="adminEmail" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-amber-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">Password</label>
          <input type="password" id="adminPassword" required class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-amber-500">
        </div>
        <div id="authError" class="text-xs text-red-600 hidden"></div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2 rounded">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ADMIN DASHBOARD MODAL -->
  <div id="adminPanelModal" class="fixed inset-0 bg-black/70 z-50 hidden overflow-y-auto p-4">
    <div class="bg-white max-w-4xl mx-auto rounded-xl shadow-2xl overflow-hidden my-8">
      <div class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
        <h2 class="text-xl font-bold text-amber-400">Store Management Console</h2>
        <div class="flex items-center space-x-3">
          <button onclick="handleAdminLogout()" class="text-xs bg-red-600 text-white px-2.5 py-1 rounded">Logout</button>
          <button onclick="closeAdminPanel()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
      </div>

      <div class="p-6 space-y-8">
        
        <!-- Add Product Form -->
        <div class="bg-gray-50 p-4 rounded-lg border">
          <h3 class="font-bold text-slate-800 mb-3">Add / Update Product</h3>
          <form onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="pName" placeholder="Product Name" required class="border p-2 rounded text-sm">
            <select id="pCategory" required class="border p-2 rounded text-sm">
              <option value="Plumbing">Plumbing & Pipes</option>
              <option value="Hardware">Hardware & Fasteners</option>
              <option value="Sanitary">Sanitaryware</option>
              <option value="Tools">Hand & Power Tools</option>
              <option value="Construction">Construction Materials</option>
            </select>
            <input type="number" id="pPrice" placeholder="Price (₹)" required class="border p-2 rounded text-sm">
            <input type="file" id="pImageFile" accept="image/*" class="border p-1.5 rounded text-sm bg-white">
            <textarea id="pDesc" placeholder="Product Description" class="border p-2 rounded text-sm md:col-span-2"></textarea>
            <button type="submit" id="saveProdBtn" class="bg-slate-900 text-white font-bold py-2 rounded md:col-span-2">Upload to Store</button>
          </form>
        </div>

        <!-- Banner Announcement Control -->
        <div class="bg-gray-50 p-4 rounded-lg border">
          <h3 class="font-bold text-slate-800 mb-2">Announcement Banner</h3>
          <div class="flex gap-2">
            <input type="text" id="bannerInput" placeholder="Special announcement message..." class="border p-2 rounded text-sm flex-grow">
            <button onclick="saveBanner()" class="bg-amber-500 font-bold px-4 rounded text-sm">Save</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // --- 1. FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // --- 2. GLOBAL STATE ---
    let products = [];
    let cart = JSON.parse(localStorage.getItem('vk_cart')) || [];
    let wishlist = JSON.parse(localStorage.getItem('vk_wishlist')) || [];
    let activeCoupon = null;

    // Electrical guardrail filter
    const blockedWords = ['bulb', 'wire', 'mcb', 'wiring', 'switch', 'cable', 'led', 'fan', 'tube', 'electric'];

    // --- 3. GESTURE & AUTH HANDLERS ---
    let tapCount = 0;
    let tapTimer = null;
    
    document.getElementById('logoTrigger').addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount === 5) {
        tapCount = 0;
        openAdminAuth();
      } else {
        tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
      }
    });

    function openAdminAuth() {
      if (auth.currentUser) {
        openAdminPanel();
      } else {
        document.getElementById('authModal').classList.remove('hidden');
        document.getElementById('authModal').classList.add('flex');
      }
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('authModal').classList.remove('flex');
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const pass = document.getElementById('adminPassword').value;
      const errDiv = document.getElementById('authError');
      
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        errDiv.classList.add('hidden');
        closeAuthModal();
        openAdminPanel();
      } catch (err) {
        errDiv.innerText = err.message;
        errDiv.classList.remove('hidden');
      }
    }

    function handleAdminLogout() {
      auth.signOut();
      closeAdminPanel();
    }

    function openAdminPanel() {
      document.getElementById('adminPanelModal').classList.remove('hidden');
    }

    function closeAdminPanel() {
      document.getElementById('adminPanelModal').classList.add('hidden');
    }

    // --- 4. PRODUCT DATA & STORAGE ---
    function listenToData() {
      // Stream Products
      db.collection('products').onSnapshot(snapshot => {
        products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderProducts();
      });

      // Stream Announcement Banner
      db.collection('settings').doc('banner').onSnapshot(doc => {
        if (doc.exists && doc.data().text) {
          document.getElementById('bannerText').innerText = doc.data().text;
          document.getElementById('bannerAlert').classList.remove('hidden');
        } else {
          document.getElementById('bannerAlert').classList.add('hidden');
        }
      });
    }

    async function saveProduct(e) {
      e.preventDefault();
      const btn = document.getElementById('saveProdBtn');
      btn.innerText = "Processing...";
      btn.disabled = true;

      const title = document.getElementById('pName').value;
      const category = document.getElementById('pCategory').value;
      const price = parseFloat(document.getElementById('pPrice').value);
      const desc = document.getElementById('pDesc').value;
      const imageFile = document.getElementById('pImageFile').files[0];

      // Blocked words validation
      const fullText = (title + ' ' + desc).toLowerCase();
      if (blockedWords.some(word => fullText.includes(word))) {
        alert("Blocked Item: Electrical items are restricted. Please add hardware or plumbing items only.");
        btn.innerText = "Upload to Store";
        btn.disabled = false;
        return;
      }

      try {
        let imageUrl = '';
        
        // Upload image to Firebase Storage
        if (imageFile) {
          const storageRef = storage.ref(`products/${Date.now()}_${imageFile.name}`);
          await storageRef.put(imageFile);
          imageUrl = await storageRef.getDownloadURL();
        }

        await db.collection('products').add({
          name: title,
          category: category,
          price: price,
          description: desc,
          imageUrl: imageUrl,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert('Product added successfully!');
        e.target.reset();
      } catch (err) {
        alert("Upload Error: " + err.message);
      } finally {
        btn.innerText = "Upload to Store";
        btn.disabled = false;
      }
    }

    async function saveBanner() {
      const text = document.getElementById('bannerInput').value;
      await db.collection('settings').doc('banner').set({ text: text });
      alert('Banner announcement updated!');
    }

    // --- 5. RENDER UI ---
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;

      const filtered = products.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(search) || p.description?.toLowerCase().includes(search);
        const matchesCat = category === 'All' || p.category === category;
        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No items found matching criteria.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm flex flex-col justify-between">
          <div class="relative bg-gray-100 h-36 flex items-center justify-center overflow-hidden">
            ${p.imageUrl ? `<img src="${p.imageUrl}" class="object-cover w-full h-full" />` : `<i class="fa-solid fa-wrench text-3xl text-gray-300"></i>`}
            <button onclick="toggleWishlist('${p.id}')" class="absolute top-2 right-2 p-1.5 rounded-full bg-white/80 text-gray-600 hover:text-red-500">
              <i class="${wishlist.includes(p.id) ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart'}"></i>
            </button>
          </div>
          <div class="p-3 flex-grow flex flex-col justify-between">
            <div>
              <span class="text-[10px] font-bold uppercase text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">${p.category}</span>
              <h4 class="font-semibold text-sm text-gray-800 line-clamp-1 mt-1">${p.name}</h4>
              <p class="text-xs text-gray-500 line-clamp-2 mt-0.5">${p.description || ''}</p>
            </div>
            <div class="mt-3 flex items-center justify-between">
              <span class="font-black text-slate-900 text-base">₹${p.price}</span>
              <button onclick="addToCart('${p.id}')" class="bg-slate-900 hover:bg-slate-800 text-amber-400 p-2 rounded-lg text-xs">
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');
      
      updateBadges();
    }

    // --- 6. CART & WISHLIST LOGIC ---
    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id, qty: 1 });
      }
      saveCart();
    }

    function saveCart() {
      localStorage.setItem('vk_cart', JSON.stringify(cart));
      updateBadges();
      renderCartItems();
    }

    function toggleCart() {
      const modal = document.getElementById('cartModal');
      modal.classList.toggle('hidden');
      modal.classList.toggle('flex');
      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-gray-400">Your shopping cart is empty.</div>`;
        updateCartTotals(0);
        return;
      }

      let subtotal = 0;
      container.innerHTML = cart.map(item => {
        const prod = products.find(p => p.id === item.id);
        if (!prod) return '';
        const lineTotal = prod.price * item.qty;
        subtotal += lineTotal;
        return `
          <div class="flex items-center justify-between py-2">
            <div>
              <h5 class="font-bold text-sm">${prod.name}</h5>
              <div class="text-xs text-gray-500">₹${prod.price} × ${item.qty}</div>
            </div>
            <div class="flex items-center space-x-2">
              <span class="font-semibold text-sm">₹${lineTotal}</span>
              <button onclick="removeFromCart('${item.id}')" class="text-red-500 text-xs px-1"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');

      updateCartTotals(subtotal);
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      saveCart();
    }

    function updateCartTotals(subtotal) {
      let discount = activeCoupon ? (subtotal * activeCoupon.percent) / 100 : 0;
      let total = Math.max(0, subtotal - discount);

      document.getElementById('cartSubtotal').innerText = `₹${subtotal.toFixed(2)}`;
      document.getElementById('cartDiscount').innerText = `-₹${discount.toFixed(2)}`;
      document.getElementById('cartTotal').innerText = `₹${total.toFixed(2)}`;
    }

    function updateBadges() {
      const cBadge = document.getElementById('cartBadge');
      const totalCartQty = cart.reduce((acc, i) => acc + i.qty, 0);
      cBadge.innerText = totalCartQty;
      cBadge.classList.toggle('hidden', totalCartQty === 0);

      const wBadge = document.getElementById('wishlistBadge');
      wBadge.innerText = wishlist.length;
      wBadge.classList.toggle('hidden', wishlist.length === 0);
    }

    function toggleWishlist(id) {
      if (!id) return;
      if (wishlist.includes(id)) {
        wishlist = wishlist.filter(i => i !== id);
      } else {
        wishlist.push(id);
      }
      localStorage.setItem('vk_wishlist', JSON.stringify(wishlist));
      renderProducts();
    }

    // --- 7. CHECKOUT & WHATSAPP ---
    function checkoutWhatsApp() {
      if (cart.length === 0) return alert('Cart is empty!');

      let msg = `*New Order - V K Traders & Hardware*\n------------------------------------\n`;
      let total = 0;

      cart.forEach(item => {
        const prod = products.find(p => p.id === item.id);
        if (prod) {
          const line = prod.price * item.qty;
          total += line;
          msg += `• ${prod.name} (x${item.qty}) - ₹${line}\n`;
        }
      });

      msg += `------------------------------------\n*Total Amount: ₹${total.toFixed(2)}*\nLocation: Shivnagar, Maharashtra`;
      
      const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(msg)}`;
      window.open(whatsappUrl, '_blank');
    }

    // Boot App
    window.addEventListener('DOMContentLoaded', listenToData);
  </script>
</body>
</html>
